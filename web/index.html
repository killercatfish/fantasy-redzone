<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy RedZone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06090f; --panel:#0d1420; --panel2:#111a29; --line:#1d2a3f;
  --ink:#eef3fb; --dim:#8394ad; --faint:#4a5a73;
  --red:#ff2d3d; --red2:#b3121f; --gold:#ffc23d; --green:#2be38a; --blue:#3d8bff;
  --mine:#3d8bff; --them:#ff6b3d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);height:100%;overflow:hidden;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}

/* fixed 1920x1080 stage, scaled to whatever screen it's on */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  display:grid;grid-template-rows:76px 1fr 124px;
  background:radial-gradient(1200px 600px at 30% -10%,#13213a 0%,transparent 60%),
             radial-gradient(900px 500px at 110% 110%,#2a0c12 0%,transparent 55%),var(--bg)}

/* brand block, top of the right column */
.brandbox{display:flex;flex-direction:column;gap:8px;padding:2px 2px 4px}
.brandbox .sub{display:flex;align-items:center;gap:18px}
.brandbox .meta{flex:1;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandbox .live{font-size:22px}
.brandbox .clock{font-size:30px}
.brand{display:flex;align-items:center;gap:14px}
.brand .mark{width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--red2));
  display:grid;place-items:center;font-weight:900;font-size:28px;letter-spacing:-1px;box-shadow:0 0 30px #ff2d3d55}
.brand .word{font-weight:900;font-size:44px;letter-spacing:1px;line-height:1}
.brand .word b{color:var(--red)}
.meta{color:var(--dim);font-size:28px;font-weight:600;letter-spacing:.5px}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:2px}
.live i{width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:pulse 1.4s infinite;will-change:opacity}
.live.demo i{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.clock{font-size:38px;font-weight:700;color:var(--ink)}
@keyframes pulse{50%{opacity:.25}}

main{grid-row:2;display:grid;grid-template-columns:1236px 1fr;gap:28px;padding:20px 40px 18px;min-height:0}

/* hero matchup */
.hero{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;
  display:grid;grid-template-rows:auto auto 1fr;overflow:hidden;min-height:0}
.hero .tag{font-family:Barlow,sans-serif;font-size:18px;font-weight:600;letter-spacing:3px;color:var(--dim);
  text-transform:uppercase;padding:18px 30px 0}
.score-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 30px 0}
.side{display:flex;flex-direction:column;gap:2px;min-width:0}
.side.r{align-items:flex-end;text-align:right}
.tname{font-size:46px;font-weight:800;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:470px}
.tsub{font-family:Barlow,sans-serif;font-size:19px;color:var(--dim);font-weight:500}
.tsub b{color:var(--gold);font-weight:700}
.big{font-size:150px;font-weight:900;line-height:.9;letter-spacing:-3px}
.big.lead{color:var(--ink)} .big.trail{color:#9fb0c8}
.vs{font-size:34px;color:var(--faint);font-weight:800;padding:0 26px;align-self:center}
.proj{font-family:Barlow,sans-serif;font-size:20px;color:var(--dim)}
.proj b{color:var(--ink);font-weight:600}

/* tug of war */
.tug{padding:16px 30px 6px}
.tug .labels{display:flex;justify-content:space-between;font-size:24px;font-weight:800;margin-bottom:8px}
.tug .labels span:first-child{color:var(--mine)} .tug .labels span:last-child{color:var(--them)}
.tug .labels em{font-style:normal;color:var(--dim);font-weight:600;font-size:20px;letter-spacing:2px}
.bar{position:relative;height:26px;border-radius:13px;background:var(--them);overflow:hidden;
  box-shadow:inset 0 0 0 1px #ffffff14}
.bar .fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#1f5fd1,var(--mine));
  transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.bar .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:3px;background:#fff;opacity:.55}
.bar .knot{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:#fff;box-shadow:0 0 18px #fff8;transition:left 1.6s cubic-bezier(.2,.8,.2,1)}

/* rosters */
.rosters{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:16px 30px 22px;min-height:0}
.roster{display:flex;flex-direction:column;gap:4px;min-height:0}
.prow{display:grid;grid-template-columns:62px 1fr 74px 76px;align-items:center;gap:10px;
  padding:5px 12px;border-radius:8px;background:#ffffff06;font-size:25px;transition:background .6s}
.prow .pos{font-family:Barlow,sans-serif;font-size:15px;font-weight:600;color:var(--dim);letter-spacing:1px}
.prow .pn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pn small{font-family:Barlow,sans-serif;font-size:15px;font-weight:600;color:var(--dim);letter-spacing:1px}
.prow .pn .tm{display:inline-flex;align-items:center;gap:5px;margin-left:10px;vertical-align:middle}
.prow .pn .tm img{width:26px;height:26px;object-fit:contain}
/* On the field: a little football left of the name, green when the unit is on, red in the red zone. */
.prow .ball{display:inline-block;width:18px;height:11px;margin-right:8px;border-radius:50%;vertical-align:middle;visibility:hidden}
.prow .ball.on{visibility:visible;background:var(--green);box-shadow:0 0 8px var(--green)}
.prow .ball.rz{visibility:visible;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1.4s infinite;will-change:opacity}
.prow .pp{text-align:right;font-weight:800}
.prow .pj{text-align:right;font-family:Barlow,sans-serif;font-size:16px;color:var(--faint)}
.prow.hot{background:#2be38a2e}
.prow.hot .pp{color:var(--green)}
.prow.zero .pn,.prow.zero .pp{color:var(--faint)}
.prow.done .pn,.prow.done .pp{color:#8db4ff}
.rhead{display:flex;justify-content:space-between;font-family:Barlow,sans-serif;font-size:15px;letter-spacing:2px;
  color:var(--faint);text-transform:uppercase;padding:0 12px 4px}

/* other matchups */
.rail{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px;min-height:0}
.rail h3{font-family:Barlow,sans-serif;font-size:16px;font-weight:600;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
.league{grid-row:3;display:grid;grid-template-columns:220px 1fr;border-top:1px solid var(--line);background:#0a0f18}
.league .flag{font-size:24px;line-height:1.05;text-align:center;background:linear-gradient(135deg,#1d2a40,#141d2c);color:var(--dim)}
#others{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:12px 40px 12px 20px;min-width:0}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 16px 9px;min-width:0;
  display:grid;align-content:center;gap:0;transition:box-shadow .5s,border-color .5s}
.mcard.flash{border-color:var(--gold);box-shadow:0 0 30px #ffc23d55}
.mline{display:flex;align-items:baseline;gap:10px;line-height:1.15}
.mline .n{flex:1;font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mline .pj{font-family:Barlow,sans-serif;font-size:14px;color:var(--faint)}
.mline .s{font-size:28px;font-weight:900;min-width:70px;text-align:right}
.mline.trail .n,.mline.trail .s{color:#8a9bb4}
.mini{height:5px;border-radius:3px;background:#3a4a63;overflow:hidden;margin-top:5px}
.mini div{height:100%;background:var(--ink);transition:width 1.6s}

/* NFL game boxes */
#games{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:8px;min-height:0}
.gbox{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;
  padding:0 14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;min-height:0;overflow:hidden}
.gbox.live{border-left-color:var(--red)}
.gbox.rz{background:#2a0c12;box-shadow:inset 0 0 0 1px var(--red)}
.gbox.mine{border-top-color:#3d8bff;border-right-color:#3d8bff;border-bottom-color:#3d8bff}
.gt{display:flex;flex-direction:column;justify-content:center;gap:4px;line-height:1.1}
.gt div{display:flex;align-items:center;gap:8px;font-size:27px;font-weight:700}
.gt img{width:30px;height:30px;object-fit:contain}
.gt .a{width:56px}
.gt .sc{margin-left:auto;font-weight:800;font-size:30px}
.gt .lose{color:#8a9bb4}
.gt i{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.gt i.rz{background:var(--red);box-shadow:0 0 8px var(--red)}
.gs{font-family:Barlow,sans-serif;font-size:19px;font-weight:700;text-align:right;color:var(--dim);white-space:nowrap}
.gbox.live .gs{color:#ff8a94}
.gbox.post .gs{color:var(--faint)}

/* crawl */
footer{grid-row:1;display:grid;grid-template-columns:220px 1fr;border-bottom:2px solid var(--red);background:#0a0f18;overflow:hidden}
.flag{background:linear-gradient(135deg,var(--red),var(--red2));display:grid;place-items:center;
  font-size:30px;font-weight:900;letter-spacing:2px}
.crawl{position:relative;overflow:hidden;white-space:nowrap}
.crawl .track{position:absolute;top:0;bottom:0;display:flex;align-items:center;will-change:transform}
.crawl .item{font-size:31px;font-weight:600;padding:0 26px;display:inline-flex;align-items:center;gap:14px}
.crawl .item::after{content:"";width:9px;height:9px;background:var(--red);transform:rotate(45deg);margin-left:26px}
.crawl .item b{color:var(--gold);font-weight:800}

/* takeover */
#takeover{position:absolute;inset:0;display:none;place-items:center;z-index:10;overflow:hidden}
#takeover.on{display:grid}
#takeover .bg{position:absolute;inset:0;animation:strobe .9s steps(2) 3}
#takeover.good .bg{background:radial-gradient(circle at 50% 50%,#1b4fb0 0%,#06090f 70%)}
#takeover.bad .bg{background:radial-gradient(circle at 50% 50%,#7a1018 0%,#06090f 70%)}
#takeover.neutral .bg{background:radial-gradient(circle at 50% 50%,#6b4d0a 0%,#06090f 70%)}
@keyframes strobe{50%{filter:brightness(2.2)}}
.tk{position:relative;text-align:center;animation:slam .5s cubic-bezier(.2,1.4,.4,1)}
.tk .kicker{font-size:44px;font-weight:800;letter-spacing:10px;color:#ffffffcc}
.tk .word{font-size:250px;font-weight:900;line-height:.85;letter-spacing:-4px;font-style:italic;
  text-shadow:0 10px 60px #000a}
#takeover.good .word{color:#fff} #takeover.bad .word{color:#ff4d5a} #takeover.neutral .word{color:var(--gold)}
.tk .who{font-size:86px;font-weight:800;margin-top:22px}
.tk .team{font-size:40px;color:#ffffffaa;font-weight:600;margin-top:6px}
.tk .plus{display:inline-block;margin-top:26px;font-size:64px;font-weight:900;padding:4px 30px;border-radius:12px;
  background:#ffffff1a;border:2px solid #ffffff33}
@keyframes slam{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:absolute;width:14px;height:26px;top:-40px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(1200px) rotate(720deg)}}

/* status + sound hint */
#status{position:absolute;left:50%;top:90px;transform:translateX(-50%);background:#2a0c12;border:1px solid var(--red);
  color:#ffd0d4;font-family:Barlow,sans-serif;font-size:22px;padding:10px 22px;border-radius:10px;display:none;z-index:5}
#soundhint{position:absolute;left:50%;transform:translateX(-50%);bottom:140px;font-family:Barlow,sans-serif;font-size:18px;color:var(--dim);
  background:#0d1420;border:1px solid var(--line);padding:8px 14px;border-radius:8px;z-index:5}
</style>
</head>
<body>
<div id="stage">
  <main>
    <section class="hero" id="hero"></section>
    <aside class="rail">
      <div class="brandbox">
        <div class="brand"><div class="mark">RZ</div><div class="word">FANTASY <b>REDZONE</b></div></div>
        <div class="sub"><div class="meta" id="meta">Loading league…</div>
          <div class="live" id="live"><i></i><span>LIVE</span></div><div class="clock num" id="clock"></div></div>
      </div>
      <h3>NFL today</h3><div id="games"></div>
    </aside>
  </main>

  <section class="league"><div class="flag">AROUND<br>THE LEAGUE</div><div id="others"></div></section>

  <footer><div class="flag">SCORING</div><div class="crawl"><div class="track" id="track"></div></div></footer>

  <div id="takeover"><div class="bg"></div><div class="tk">
    <div class="kicker" id="tkKicker"></div><div class="word" id="tkWord"></div>
    <div class="who" id="tkWho"></div><div class="team" id="tkTeam"></div><div class="plus num" id="tkPlus"></div>
  </div></div>
  <div id="status"></div>
  <div id="soundhint">Press OK / click once to turn on sound</div>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = n => (Math.round(n * 10) / 10).toFixed(1);
/* Round one side only so the pair always adds to 100%. */
const pct = p => Math.round(p * 100);
/* Featured matchup: TV remote / keyboard arrows cycle; ?team=ID pins one; Home (or 0) goes back to yours. */
const pinParam = new URLSearchParams(location.search).get("team");
let pinTeam = pinParam ? Number(pinParam) : null, featured = 0;
addEventListener("keydown", e => {
  if (!state) return;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { pinTeam = null; featured++; render(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { pinTeam = null; featured--; render(); }
  else if (e.key === "Home" || e.key === "0") { pinTeam = null; featured = 0; render(); }
  else if (e.key === "t" || e.key === "T") {  // test call: a fake TD for your team, horn + voice
    queue.push({kind: "td", mine: true, against_me: false, player: "Test Player", team: "Your team", gain: 6});
    setTimeout(showNext, 300);  // let the same keypress finish turning sound on first
  }
});
let state = null, lastSeq = null, prevPts = {}, hot = {}, queue = [], showing = false, audio = null;

/* ---------- fit the 1920x1080 stage to the screen ---------- */
function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  const st = $("#stage");
  st.style.transform = `scale(${s})`;
  st.style.left = (innerWidth - 1920 * s) / 2 + "px";
  st.style.top = (innerHeight - 1080 * s) / 2 + "px";
}
addEventListener("resize", fit); fit();

setInterval(() => {
  $("#clock").textContent = new Date().toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
}, 1000);

/* ---------- sound: synthesized air horn + spoken call ---------- */
function enableSound(){
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (audio && audio.state === "suspended") audio.resume();
  if (audio && audio.state === "running") $("#soundhint").style.display = "none";
}
addEventListener("click", enableSound); addEventListener("keydown", enableSound);
enableSound(); // works straight away when the browser allows autoplay (e.g. Pi kiosk flag)

function horn(sad){
  if (!audio || audio.state !== "running") return;
  const t0 = audio.currentTime, out = audio.createGain();
  out.gain.value = 0.22; out.connect(audio.destination);
  const blasts = sad ? [[0, .9]] : [[0, .45], [.55, .45], [1.1, 1.0]];
  for (const [st, len] of blasts) {
    for (const f of (sad ? [220, 207] : [466, 470, 349])) {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(f, t0 + st);
      if (sad) o.frequency.exponentialRampToValueAtTime(f * .6, t0 + st + len);
      g.gain.setValueAtTime(0, t0 + st);
      g.gain.linearRampToValueAtTime(.5, t0 + st + .03);
      g.gain.setValueAtTime(.5, t0 + st + len - .08);
      g.gain.linearRampToValueAtTime(0, t0 + st + len);
      o.connect(g); g.connect(out); o.start(t0 + st); o.stop(t0 + st + len + .05);
    }
  }
}
function browserSay(text){
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.rate = 1.02; u.pitch = .9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
// The voice server (kira_voice_url, via our server). Fetch starts at once so it's ready by the time
// the horn finishes; if it can't answer, the browser's own voice says the line instead.
function kiraLine(text){
  const clip = fetch("/api/say?text=" + encodeURIComponent(text))
    .then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
    .then(buf => audio.decodeAudioData(buf));
  clip.catch(() => {});
  return () => clip.then(b => {
    const src = audio.createBufferSource(); src.buffer = b; src.connect(audio.destination); src.start();
  }).catch(() => browserSay(text));
}

/* ---------- takeover queue ---------- */
function confetti(colors){
  const tk = $("#takeover");
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div"); c.className = "confetti";
    c.style.left = Math.random() * 1920 + "px";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.8 + Math.random() * 2.2) + "s";
    c.style.animationDelay = (Math.random() * .6) + "s";
    tk.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}
function showNext(){
  if (showing || !queue.length) return;
  const ev = queue.shift(); showing = true;
  const tk = $("#takeover");
  const td = ev.kind === "td";
  const mood = ev.mine ? "good" : ev.against_me ? "bad" : "neutral";
  tk.className = "on " + mood;
  $("#tkKicker").textContent = ev.mine ? "YOUR GUY" : ev.against_me ? "BAD NEWS" : "AROUND THE LEAGUE";
  $("#tkWord").textContent = td ? (ev.against_me ? "OUCH." : "TOUCHDOWN") : "BIG PLAY";
  $("#tkWho").textContent = ev.player;
  $("#tkTeam").textContent = ev.team;
  $("#tkPlus").textContent = "+" + fmt(ev.gain);
  if (mood === "good") confetti(["#3d8bff", "#ffffff", "#ffc23d", "#2be38a"]);
  if (ev.mine || ev.against_me) {
    horn(ev.against_me);
    if (audio && audio.state === "running") {
      const say = kiraLine(ev.against_me
        ? `Ugh. ${ev.player} just put up ${fmt(ev.gain)} against you.`
        : `${td ? "Touchdown" : "Big play"}, ${ev.player}! Plus ${fmt(ev.gain)}.`);
      setTimeout(say, ev.against_me ? 900 : 1700);
    }
  }
  setTimeout(() => { tk.className = ""; showing = false; setTimeout(showNext, 600); },
    (ev.mine || ev.against_me) ? 6500 : 3500);
}

/* ---------- rendering ---------- */
function rosterParts(team){
  const starters = team.players.filter(p => !p.bench);
  return [`<div class="rhead"><span>${esc(team.abbrev || team.name)}</span><span>PTS · PROJ</span></div>`,
    ...starters.map(p => {
      const cls = hot[p.id] && Date.now() - hot[p.id] < 9000 ? "hot" : rowState(p);
      return `<div class="prow ${cls}"><span class="pos">${esc(p.slot)}</span><span class="pn"><i class="ball ${p.field || ""}"></i>${esc(p.name)}${p.nfl ? `<span class="tm"><img src="${logo(p.nfl)}" alt=""><small>${esc(p.nfl)}</small></span>` : ""}</span>
        <span class="pp num">${fmt(p.pts)}</span><span class="pj num">${p.proj == null ? "" : fmt(p.proj)}</span></div>`;
    })];
}
// Swap in only the children whose markup changed (each part is one element). Rebuilding the whole
// board took 300-500 ms on the TV's chip, long enough to make the crawl stall.
function patch(el, parts){
  const kids = el.children;
  if (kids.length !== parts.length) {
    el.innerHTML = parts.join("");
    [...el.children].forEach((k, i) => k._html = parts[i]);
    return;
  }
  parts.forEach((h, i) => {
    if (kids[i]._html === h) return;
    const t = document.createElement("template");
    t.innerHTML = h.trim();
    const n = t.content.firstElementChild;
    n._html = h;
    el.replaceChild(n, kids[i]);
  });
}
// NFL team logos from ESPN's CDN (dark-background versions), sized 2x for a sharp TV.
const logo = abbr => `https://a.espncdn.com/combiner/i?img=/i/teamlogos/nfl/500-dark/scoreboard/${abbr.toLowerCase()}.png&h=56&w=56`;
// Record, bench points, and (once games finish) how much a better lineup would have added.
function subline(t){
  const bits = [esc(t.record || "")];
  if (t.bench_pts != null) bits.push(`Bench ${fmt(t.bench_pts)}`);
  if (t.missed > 0) bits.push(`<b>Left on bench ${fmt(t.missed)}</b>`);
  return bits.filter(Boolean).join("  ·  ");
}
// Grey = hasn't played yet, white = playing now, blue = game over (or on bye).
function rowState(p){
  if (p.game === "post" || p.game === "bye") return "done";
  if (p.game === "pre") return "zero";
  if (p.game === "in") return "";
  return p.pts === 0 ? "zero" : "";
}
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  if (!state || !state.matchups || !state.matchups.length) return;
  $("#meta").textContent = `${state.league}  ·  Week ${state.week}`;
  $("#live").className = "live" + (state.demo ? " demo" : "");
  $("#live span").textContent = state.demo ? "DEMO" : "LIVE";

  const ms = state.matchups;
  if (pinTeam != null) {                       // ?team=ID keeps that team featured
    const i = ms.findIndex(m => m[0].id === pinTeam || m[1].id === pinTeam);
    if (i >= 0) featured = i;
  }
  featured = ((featured % ms.length) + ms.length) % ms.length;
  let [a, b] = ms[featured];
  const my = state.my_team_id;
  const focus = pinTeam ?? my;
  if (focus != null && b.id === focus) [a, b] = [b, a];
  const p = a.win_prob ?? .5;
  const lead = a.pts >= b.pts;
  patch($("#hero"), [`
    <div class="tag">${my != null && a.id === my ? "Your matchup" : "Featured matchup"} · ${featured + 1}/${ms.length} <span style="color:var(--faint)">◀ ▶ to switch</span></div>`, `
    <div class="score-row">
      <div class="side"><div class="tname">${esc(a.name)}</div><div class="tsub">${subline(a)}</div>
        <div class="big num ${lead ? "lead" : "trail"}">${fmt(a.pts)}</div>
        <div class="proj">Proj <b class="num">${fmt(a.proj)}</b></div></div>
      <div class="vs">VS</div>
      <div class="side r"><div class="tname">${esc(b.name)}</div><div class="tsub">${subline(b)}</div>
        <div class="big num ${lead ? "trail" : "lead"}">${fmt(b.pts)}</div>
        <div class="proj">Proj <b class="num">${fmt(b.proj)}</b></div></div>
    </div>`, `
    <div class="tug">
      <div class="labels"><span class="num">${pct(p)}%</span><em>WIN PROBABILITY</em><span class="num">${100 - pct(p)}%</span></div>
      <div class="bar"><div class="fill" style="width:${p * 100}%"></div><div class="mid"></div><div class="knot" style="left:${p * 100}%"></div></div>
    </div>`, `<div class="rosters"><div class="roster"></div><div class="roster"></div></div>`]);
  const [ra, rb] = document.querySelectorAll("#hero .roster");
  patch(ra, rosterParts(a));
  patch(rb, rosterParts(b));

  const flashTeams = new Set(state.events.filter(e => Date.now() / 1000 - e.t < 12).map(e => e.team_id));
  patch($("#others"), ms.filter((_, i) => i !== featured).slice(0, 4).map(([x, y]) => {
    const xl = x.pts >= y.pts, px = x.win_prob ?? .5;
    const fl = flashTeams.has(x.id) || flashTeams.has(y.id) ? " flash" : "";
    return `<div class="mcard${fl}">
      <div class="mline ${xl ? "" : "trail"}"><span class="n">${esc(x.name)}</span><span class="pj num">proj ${fmt(x.proj)}</span><span class="s num">${fmt(x.pts)}</span></div>
      <div class="mline ${xl ? "trail" : ""}"><span class="n">${esc(y.name)}</span><span class="pj num">proj ${fmt(y.proj)}</span><span class="s num">${fmt(y.pts)}</span></div>
      <div class="mini"><div style="width:${px * 100}%"></div></div>
    </div>`;
  }));
  renderGames();
}

/* ---------- NFL games: live first, then kickoffs to come, then finals ---------- */
function kickoff(iso){
  const d = new Date(iso), t = d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString([], {weekday: "short"}) + " " + t;
}
function renderGames(){
  const mine = state.matchups.flat().find(t => t.id === state.my_team_id);
  const myNfl = new Set((mine ? mine.players : []).filter(p => !p.bench && !p.empty).map(p => p.nfl));
  patch($("#games"), (state.games || []).map(g => {
    const cls = ["gbox", g.state === "in" ? "live" : g.state, g.redzone ? "rz" : "",
                 myNfl.has(g.away.abbr) || myNfl.has(g.home.abbr) ? "mine" : ""].join(" ");
    const row = (t, o) => `<div><img src="${logo(t.abbr)}" alt=""><span class="a ${g.state === "post" && t.score < o.score ? "lose" : ""}">${esc(t.abbr)}</span>
      ${g.poss === t.id ? `<i class="${g.redzone ? "rz" : ""}"></i>` : ""}
      <span class="sc num ${g.state === "post" && t.score < o.score ? "lose" : ""}">${g.state === "pre" ? "" : t.score}</span></div>`;
    return `<div class="${cls}"><div class="gt">${row(g.away, g.home)}${row(g.home, g.away)}</div>
      <div class="gs">${esc(g.label || kickoff(g.start))}</div></div>`;
  }));
}

/* ---------- crawl: scoring plays + generated trash talk ---------- */
function crawlItems(){
  const items = [];
  const recent = [...state.events].reverse().slice(0, 8);
  for (const e of recent) items.push(`<b>${e.kind === "td" ? "TD" : "BIG PLAY"}</b> ${esc(e.player)} (${esc(e.team)}) +${fmt(e.gain)}`);
  for (const [x, y] of state.matchups) {
    const [w, l] = x.pts >= y.pts ? [x, y] : [y, x];
    const gap = w.pts - l.pts;
    items.push(`${esc(w.name)} <b>${fmt(w.pts)}</b> – ${esc(l.name)} <b>${fmt(l.pts)}</b>`);
    if (gap > 30) items.push(`${esc(l.name)} down ${fmt(gap)} — time to start drafting excuses`);
    for (const t of [x, y]) {
      const st = t.players.filter(p => !p.bench);
      const flop = st.filter(p => p.proj && p.pts < p.proj * .3 && t.proj - t.pts < 15)[0];
      if (t.missed >= 5) items.push(`Bench watch: ${esc(t.name)} left <b>${fmt(t.missed)}</b> points on the bench`);
      if (flop) items.push(`${esc(flop.name)} is giving ${esc(t.name)} ${fmt(flop.pts)} on a ${fmt(flop.proj)} projection`);
      const mvp = st.reduce((m, p) => p.pts > (m?.pts ?? -1) ? p : m, null);
      if (mvp && mvp.pts > 25) items.push(`${esc(mvp.name)} is carrying ${esc(t.name)} with <b>${fmt(mvp.pts)}</b>`);
    }
    const pw = Math.max(w.win_prob ?? 0, l.win_prob ?? 0);
    if (pw > .5 && pw < .6 && gap < 8) items.push(`Coin flip: ${esc(x.name)} vs ${esc(y.name)} is within ${fmt(gap)}`);
  }
  return items;
}
// One animation per lap, run by the graphics chip, so board redraws and slow TV chips can't make it
// stutter. Each lap picks up fresh content.
const CRAWL_START = 1700, CRAWL_SPEED = 132;   // px per second
function crawlLap(){
  const track = $("#track");
  track.innerHTML = crawlItems().map(i => `<span class="item">${i}</span>`).join("");
  const dist = CRAWL_START + track.scrollWidth;
  track.animate([{transform: `translateX(${CRAWL_START}px)`}, {transform: `translateX(${-track.scrollWidth}px)`}],
                {duration: dist / CRAWL_SPEED * 1000, easing: "linear", fill: "forwards"}).onfinish = crawlLap;
}

/* ---------- polling ---------- */
async function poll(){
  try {
    const r = await fetch("/api/board", {cache: "no-store"});
    const s = await r.json();
    $("#status").style.display = s.error ? "block" : "none";
    $("#status").textContent = s.error || "";
    if (!s.ok && !state) return;
    if (s.ok) {
      // Redraw only when the server has new data (every 30 s in games, about hourly between them):
      // a full redraw is heavy enough on a TV's chip to make the crawl skip.
      if (state && s.updated === state.updated) return;
      let warm = false;
      for (const [x, y] of s.matchups) for (const t of [x, y]) for (const p of t.players) {
        if (prevPts[p.id] != null && p.pts - prevPts[p.id] >= 1) { hot[p.id] = Date.now(); warm = true; }
        prevPts[p.id] = p.pts;
      }
      if (warm) setTimeout(render, 9100);   // turn the green rows back off after their 9 seconds
      const maxSeq = s.events.reduce((m, e) => Math.max(m, e.seq), 0);
      if (lastSeq === null) lastSeq = maxSeq;           // don't replay old plays on page load
      for (const e of s.events) if (e.seq > lastSeq) {
        // Takeover only for plays in your matchup, plus TDs elsewhere.
        if (e.mine || e.against_me) queue.push(e);
        else if (e.kind === "td" && queue.length === 0 && !showing) queue.push(e);
      }
      lastSeq = Math.max(lastSeq, maxSeq);
      const first = !state; state = s; render();
      if (first) crawlLap();
      showNext();
    }
  } catch (e) {
    $("#status").style.display = "block"; $("#status").textContent = "Board server not responding";
  }
}
poll(); setInterval(poll, 3000);
</script>
